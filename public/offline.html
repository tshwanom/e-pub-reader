<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | One Man Revolution</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1eb;
        --surface: rgba(255, 255, 255, 0.92);
        --text: #163036;
        --muted: #5d6f73;
        --accent: #3d737a;
        --border: rgba(61, 115, 122, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top, rgba(61, 115, 122, 0.12), transparent 42%), var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      main {
        width: min(100%, 560px);
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: 0 24px 80px rgba(16, 32, 36, 0.08);
        padding: 32px;
      }

      .eyebrow {
        margin: 0;
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 14px 0 0;
        font-size: clamp(2rem, 5vw, 2.8rem);
        line-height: 1.05;
      }

      p {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
      }

      .primary {
        background: var(--accent);
        color: white;
      }

      .secondary {
        border: 1px solid var(--border);
        color: var(--text);
        background: white;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Offline reading</p>
      <h1>You&rsquo;re offline right now</h1>
      <p>
        Previously opened books stay available on this device, so you can keep reading without a connection.
        If a title has not been opened online yet, reconnect once to save it for instant offline reading next time.
      </p>
      <div class="actions">
        <a class="primary" href="/library">Open library</a>
        <a class="secondary" href="/">Back home</a>
      </div>
    </main>
  </body>
</html>
